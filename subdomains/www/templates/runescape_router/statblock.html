<table class="stat-block" hx-get="/getStats" hx-vals='{"playerName": "{{playerName}}"}' hx-trigger="click" hx-swap="outerHTML">
    <caption>{{playerName}}</caption>
    <thead>
        <th>Stat</th>
        <th>Experience</th>
        <th>Level</th>
    </thead>
    <tbody>
        {% for stat in stats %}
            <tr class="skill">
                <td>{{stat}}</td>
                <td>{{ statDetails.get(stat)["experience"] }}</td>
                <td>{{ statDetails.get(stat)["level"] }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
